plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'com.example.townweather'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.townweather'
        minSdk 24
        targetSdk 34 // ponytail: 34 avoids Android 15's forced edge-to-edge layout; bump to 35 + handle insets if publishing to Play
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // OpenStreetMap map view — free, no API key (Google Maps would need one)
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
